[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upscaler-cli"
version = "0.3.0"
description = "Upscaler CLI - search, retrieve, and manage documents, records, and workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Upscaler", email = "support@upscaler.io" }]
keywords = ["upscaler", "compliance", "iso27001", "isms", "cli", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.27,<1",
    # 42.0.4 is the first release clear of the NULL-dereference and
    # Bleichenbacher advisories affecting the 41.x line this floor used to
    # allow; a resolver on an old lockfile could otherwise satisfy the
    # requirement with a vulnerable build.
    "cryptography>=42.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "black>=24.0",
    "flake8>=7.0",
    "isort>=5.13",
    "build>=1.0",
]

[project.urls]
Homepage = "https://upscaler.app"
Repository = "https://github.com/upscaler-io/upscaler-cli"
Issues = "https://github.com/upscaler-io/upscaler-cli/issues"
Changelog = "https://github.com/upscaler-io/upscaler-cli/blob/main/CHANGELOG.md"
"Agent skills" = "https://github.com/upscaler-io/upscaler-skills"

[project.scripts]
upscaler = "upscaler_cli.cli.main:cli"

[tool.setuptools.packages.find]
include = ["upscaler_cli*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
