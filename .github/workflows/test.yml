name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: python -m pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      # A wheel that ships a top-level `src/` package would squat a name every
      # other project uses. Fail the build rather than discover it on PyPI.
      - name: Check metadata and top-level package
        run: |
          set -e
          twine check dist/*
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          tops = {n.split("/")[0] for n in zipfile.ZipFile(wheel).namelist()}
          tops = {t for t in tops if not t.endswith(".dist-info")}
          print("top-level entries:", sorted(tops))
          if tops != {"upscaler_cli"}:
              sys.exit(f"unexpected top-level packages in wheel: {sorted(tops)}")
          PY
