name: release

# Publishes to PyPI when a v* tag is pushed. Build and publish are separate
# jobs so the build never holds a token- or OIDC-scoped credential.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token in
# GitHub secrets. One-time setup on PyPI, under the `upscaler-cli` project ->
# Settings -> Publishing:
#   Owner: upscaler-io   Repository: upscaler-cli
#   Workflow: release.yml   Environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # A tag that disagrees with pyproject.toml would publish a mislabelled
      # release, so fail here rather than on PyPI where it cannot be undone.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -e
          PKG_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          TAG_VERSION="${TAG_REF#v}"
          echo "tag=${TAG_VERSION} pyproject=${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${TAG_VERSION} does not match pyproject version ${PKG_VERSION}"
            exit 1
          fi

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
